<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Explorador de cónicas</title>

    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)']],
          displayMath: [['\\[', '\\]']]
        },
        svg: { fontCache: 'global' }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>

    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #1f2937; background: #fff; font-family: Inter, system-ui, sans-serif; }
      .app { min-height: 100vh; display: grid; grid-template-columns: minmax(220px, 290px) 1fr; }
      .controls { padding: 18px; background: #f8fafc; border-right: 1px solid #d8e1ef; }
      .controls h1 { color: #163d86; font-size: 1.15rem; }
      .controls label {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        margin: 12px 0;
        font-size: .9rem;
      }
      .controls input,
      .controls select { width: 100%; }
      .canvas { min-height: 430px; display: grid; place-items: center; padding: 10px; }
      #svg { width: 100%; height: min(76vh, 650px); background: #fff; } 
      .equation {
        min-height: 62px;
        padding: 10px;
        overflow-x: auto;
        text-align: center;
        background: #fff;
        border: 1px solid #d8e1ef;
        border-radius: 10px;
      }
      .check { display: flex !important; grid-template-columns: auto 1fr !important; justify-content: start; }
      .legend { color: #5b6575; font-size: .82rem; }
      @media (max-width: 720px) {
        .app { grid-template-columns: 1fr; }
        .controls { border-right: 0; border-bottom: 1px solid #d8e1ef; }
        .canvas { min-height: 380px; }
        #svg { height: 460px; }
      }
    </style>
  </head>

  <body>
    <div class="app">
      <aside class="controls">
        <h1>Explorador de cónicas</h1>

        <label>
          Tipo
          <select id="type">
            <option value="circle">Circunferencia</option>
            <option value="ellipse">Elipse</option>
            <option value="parabola">Parábola</option>
            <option value="hyperbola">Hipérbola</option>
          </select>
        </label>

        <label>\(h\) <span id="hv"></span><input id="h" type="range" min="-4" max="4" step=".1" value="0"></label>
        <label>\(k\) <span id="kv"></span><input id="k" type="range" min="-4" max="4" step=".1" value="0"></label>
        <label>\(a, r\) o \(p\) <span id="av"></span><input id="a" type="range" min=".5" max="5" step=".1" value="3"></label>
        <label>\(b\) <span id="bv"></span><input id="b" type="range" min=".5" max="4.5" step=".1" value="2"></label>

        <label class="check"><input id="features" type="checkbox" checked> Mostrar elementos notables</label>
        <label class="check"><input id="grid" type="checkbox" checked> Mostrar cuadrícula</label>

        <div id="eq" class="equation"></div>
        <p class="legend">
          Azul: cónica · rojo: focos o foco · verde: vértices · gris punteado: directriz o asíntotas.
        </p>
      </aside>

      <main class="canvas">
        <svg id="svg" viewBox="-10 -8 20 16" aria-label="Gráfico cartesiano interactivo"></svg>
      </main>
    </div>

    <script>
      const SVG_NS = 'http://www.w3.org/2000/svg';
      const svg = document.getElementById('svg');
      const byId = id => document.getElementById(id);
      const equationBox = byId('eq');
      const controls = ['type', 'h', 'k', 'a', 'b', 'features', 'grid'].map(byId);

      function element(tag, attributes = {}) {
        const node = document.createElementNS(SVG_NS, tag);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
        return node;
      }

      function line(x1, y1, x2, y2, attributes = {}) {
        svg.append(element('line', { x1, y1: -y1, x2, y2: -y2, ...attributes }));
      }

      function dot(x, y, color, label) {
        svg.append(element('circle', { cx: x, cy: -y, r: .13, fill: color }));
        const text = element('text', { x: x + .18, y: -y - .18, 'font-size': '.42', fill: color });
        text.textContent = label;
        svg.append(text);
      }

      function path(points, attributes = {}) {
        svg.append(element('polyline', {
          points: points.map(([x, y]) => `${x},${-y}`).join(' '),
          fill: 'none',
          ...attributes
        }));
      }

      function number(value) {
        const rounded = Math.abs(value) < 1e-9 ? 0 : value;
        return Number(rounded.toFixed(1));
      }

      function shift(variable, value) {
        const v = number(value);
        if (v === 0) return variable;
        return v > 0 ? `${variable}-${v}` : `${variable}+${Math.abs(v)}`;
      }

      function renderEquation(latex) {
        equationBox.textContent = String.raw`\(${latex}\)`;
        if (!window.MathJax?.typesetPromise) return;
        MathJax.typesetClear([equationBox]);
        MathJax.typesetPromise([equationBox]);
      }

      function draw() {
        svg.innerHTML = '';

        const type = byId('type').value;
        const h = Number(byId('h').value);
        const k = Number(byId('k').value);
        const a = Number(byId('a').value);
        const b = Number(byId('b').value);
        const showFeatures = byId('features').checked;

        if (byId('grid').checked) {
          for (let x = -10; x <= 10; x += 1) {
            line(x, -8, x, 8, { stroke: '#edf1f6', 'stroke-width': .025 });
          }
          for (let y = -8; y <= 8; y += 1) {
            line(-10, y, 10, y, { stroke: '#edf1f6', 'stroke-width': .025 });
          }
        }

        line(-10, 0, 10, 0, { stroke: '#111827', 'stroke-width': .06 });
        line(0, -8, 0, 8, { stroke: '#111827', 'stroke-width': .06 });

        let points = [];

        if (type === 'circle') {
          for (let i = 0; i <= 240; i += 1) {
            const t = (2 * Math.PI * i) / 240;
            points.push([h + a * Math.cos(t), k + a * Math.sin(t)]);
          }
          path(points, { stroke: '#164bb8', 'stroke-width': .11 });
          if (showFeatures) dot(h, k, '#16a34a', 'C');
          renderEquation(`\\left(${shift('x', h)}\\right)^2+\\left(${shift('y', k)}\\right)^2=${a.toFixed(1)}^2`);
        }

        if (type === 'ellipse') {
          const A = Math.max(a, b);
          const B = Math.min(a, b);
          for (let i = 0; i <= 240; i += 1) {
            const t = (2 * Math.PI * i) / 240;
            points.push([h + A * Math.cos(t), k + B * Math.sin(t)]);
          }
          path(points, { stroke: '#164bb8', 'stroke-width': .11 });
          const c = Math.sqrt(Math.max(0, A * A - B * B));
          if (showFeatures) {
            dot(h - c, k, '#dc2626', 'F₁');
            dot(h + c, k, '#dc2626', 'F₂');
            dot(h - A, k, '#16a34a', 'V₁');
            dot(h + A, k, '#16a34a', 'V₂');
          }
          renderEquation(`\\frac{\\left(${shift('x', h)}\\right)^2}{${A.toFixed(1)}^2}+\\frac{\\left(${shift('y', k)}\\right)^2}{${B.toFixed(1)}^2}=1`);
        }

        if (type === 'parabola') {
          const p = a / 2;
          for (let y = -7; y <= 7; y += .05) {
            const x = h + ((y - k) * (y - k)) / (4 * p);
            if (x < 10) points.push([x, y]);
          }
          path(points, { stroke: '#164bb8', 'stroke-width': .11 });
          if (showFeatures) {
            dot(h, k, '#16a34a', 'V');
            dot(h + p, k, '#dc2626', 'F');
            line(h - p, -8, h - p, 8, {
              stroke: '#64748b',
              'stroke-width': .07,
              'stroke-dasharray': '.2 .13'
            });
          }
          renderEquation(`\\left(${shift('y', k)}\\right)^2=${(4 * p).toFixed(1)}\\left(${shift('x', h)}\\right)`);
        }

        if (type === 'hyperbola') {
          const A = a;
          const B = b;
          const c = Math.sqrt(A * A + B * B);
          for (const side of [-1, 1]) {
            points = [];
            for (let t = -2; t <= 2; t += .025) {
              points.push([h + side * A * Math.cosh(t), k + B * Math.sinh(t)]);
            }
            path(points, { stroke: '#164bb8', 'stroke-width': .11 });
          }
          if (showFeatures) {
            line(-10, k - (B / A) * (10 + h), 10, k + (B / A) * (10 - h), {
              stroke: '#64748b',
              'stroke-width': .07,
              'stroke-dasharray': '.2 .13'
            });
            line(-10, k + (B / A) * (10 + h), 10, k - (B / A) * (10 - h), {
              stroke: '#64748b',
              'stroke-width': .07,
              'stroke-dasharray': '.2 .13'
            });
            dot(h - c, k, '#dc2626', 'F₁');
            dot(h + c, k, '#dc2626', 'F₂');
            dot(h - A, k, '#16a34a', 'V₁');
            dot(h + A, k, '#16a34a', 'V₂');
          }
          renderEquation(`\\frac{\\left(${shift('x', h)}\\right)^2}{${A.toFixed(1)}^2}-\\frac{\\left(${shift('y', k)}\\right)^2}{${B.toFixed(1)}^2}=1`);
        }

        byId('hv').textContent = h;
        byId('kv').textContent = k;
        byId('av').textContent = a;
        byId('bv').textContent = b;
      }

      controls.forEach(control => control.addEventListener('input', draw));

      const requestedType = new URLSearchParams(location.search).get('tipo');
      if (requestedType) {
        const typeMap = {
          parabola: 'parabola',
          elipse: 'ellipse',
          hiperbola: 'hyperbola',
          circunferencia: 'circle'
        };
        byId('type').value = typeMap[requestedType] || 'circle';
      }

      draw();
    </script>
  </body>
</html>
