<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Explorador de cónicas</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#fff;color:#1f2937}.app{min-height:100vh;display:grid;grid-template-columns:minmax(220px,290px) 1fr}.controls{padding:18px;border-right:1px solid #d8e1ef;background:#f8fafc}.controls h1{font-size:1.15rem;color:#163d86}.controls label{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0;font-size:.9rem}.controls input,.controls select{width:100%}.canvas{min-height:430px;display:grid;place-items:center;padding:10px}svg{width:100%;height:min(76vh,650px);background:#fff}.equation{padding:10px;border:1px solid #d8e1ef;border-radius:10px;background:#fff;font-family:Georgia,serif;text-align:center}.check{display:flex!important;grid-template-columns:auto 1fr!important;justify-content:start}.legend{font-size:.82rem;color:#5b6575}@media(max-width:720px){.app{grid-template-columns:1fr}.controls{border-right:0;border-bottom:1px solid #d8e1ef}.canvas{min-height:380px}svg{height:460px}}</style></head><body><div class="app"><aside class="controls"><h1>Explorador de cónicas</h1><label>Tipo <select id="type"><option value="circle">Circunferencia</option><option value="ellipse">Elipse</option><option value="parabola">Parábola</option><option value="hyperbola">Hipérbola</option></select></label><label>h <span id="hv"></span><input id="h" type="range" min="-4" max="4" step=".1" value="0"></label><label>k <span id="kv"></span><input id="k" type="range" min="-4" max="4" step=".1" value="0"></label><label>a/r/p <span id="av"></span><input id="a" type="range" min=".5" max="5" step=".1" value="3"></label><label>b <span id="bv"></span><input id="b" type="range" min=".5" max="4.5" step=".1" value="2"></label><label class="check"><input id="features" type="checkbox" checked> Mostrar elementos notables</label><label class="check"><input id="grid" type="checkbox" checked> Mostrar cuadrícula</label><div id="eq" class="equation"></div><p class="legend">Azul: cónica · rojo: focos o foco · verde: vértices · gris punteado: directriz o asíntotas.</p></aside><main class="canvas"><svg id="svg" viewBox="-10 -8 20 16" aria-label="Gráfico cartesiano interactivo"></svg></main></div><script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('svg');const $=id=>document.getElementById(id);const els=['type','h','k','a','b','features','grid'].map($);function E(tag,attrs={}){const e=document.createElementNS(NS,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}function line(x1,y1,x2,y2,attrs={}){svg.append(E('line',{x1,y1:-y1,x2,y2:-y2,...attrs}))}function dot(x,y,color,label){svg.append(E('circle',{cx:x,cy:-y,r:.13,fill:color}));const t=E('text',{x:x+.18,y:-y-.18,'font-size':'.42',fill:color});t.textContent=label;svg.append(t)}function path(points,attrs={}){svg.append(E('polyline',{points:points.map(([x,y])=>`${x},${-y}`).join(' '),fill:'none',...attrs}))}function draw(){svg.innerHTML='';const type=$('type').value,h=+$('h').value,k=+$('k').value,a=+$('a').value,b=+$('b').value,feat=$('features').checked;if($('grid').checked){for(let i=-10;i<=10;i++){line(i,-8,i,8,{stroke:'#edf1f6','stroke-width':.025});}for(let j=-8;j<=8;j++)line(-10,j,10,j,{stroke:'#edf1f6','stroke-width':.025});}line(-10,0,10,0,{stroke:'#111827','stroke-width':.06});line(0,-8,0,8,{stroke:'#111827','stroke-width':.06});let pts=[];if(type==='circle'){for(let i=0;i<=240;i++){const t=2*Math.PI*i/240;pts.push([h+a*Math.cos(t),k+a*Math.sin(t)])}path(pts,{stroke:'#164bb8','stroke-width':.11});if(feat)dot(h,k,'#16a34a','C');$('eq').textContent=`(x-${h})²+(y-${k})²=${a.toFixed(1)}²`;}if(type==='ellipse'){const A=Math.max(a,b),B=Math.min(a,b);for(let i=0;i<=240;i++){const t=2*Math.PI*i/240;pts.push([h+A*Math.cos(t),k+B*Math.sin(t)])}path(pts,{stroke:'#164bb8','stroke-width':.11});const c=Math.sqrt(Math.max(0,A*A-B*B));if(feat){dot(h-c,k,'#dc2626','F₁');dot(h+c,k,'#dc2626','F₂');dot(h-A,k,'#16a34a','V₁');dot(h+A,k,'#16a34a','V₂')}$('eq').textContent=`(x-${h})²/${A.toFixed(1)}²+(y-${k})²/${B.toFixed(1)}²=1`;}if(type==='parabola'){const p=a/2;for(let y=-7;y<=7;y+=.05){const x=h+(y-k)*(y-k)/(4*p);if(x<10)pts.push([x,y])}path(pts,{stroke:'#164bb8','stroke-width':.11});if(feat){dot(h,k,'#16a34a','V');dot(h+p,k,'#dc2626','F');line(h-p,-8,h-p,8,{stroke:'#64748b','stroke-width':.07,'stroke-dasharray':'.2 .13'})}$('eq').textContent=`(y-${k})²=${(4*p).toFixed(1)}(x-${h})`;}if(type==='hyperbola'){const A=a,B=b,c=Math.sqrt(A*A+B*B);for(const s of[-1,1]){pts=[];for(let t=-2;t<=2;t+=.025)pts.push([h+s*A*Math.cosh(t),k+B*Math.sinh(t)]);path(pts,{stroke:'#164bb8','stroke-width':.11})}if(feat){line(-10,k-B/A*(10+h),10,k+B/A*(10-h),{stroke:'#64748b','stroke-width':.07,'stroke-dasharray':'.2 .13'});line(-10,k+B/A*(10+h),10,k-B/A*(10-h),{stroke:'#64748b','stroke-width':.07,'stroke-dasharray':'.2 .13'});dot(h-c,k,'#dc2626','F₁');dot(h+c,k,'#dc2626','F₂');dot(h-A,k,'#16a34a','V₁');dot(h+A,k,'#16a34a','V₂')}$('eq').textContent=`(x-${h})²/${A.toFixed(1)}²−(y-${k})²/${B.toFixed(1)}²=1`;}$('hv').textContent=h;$('kv').textContent=k;$('av').textContent=a;$('bv').textContent=b;}els.forEach(e=>e.addEventListener('input',draw));const param=new URLSearchParams(location.search).get('tipo');if(param){const map={parabola:'parabola',elipse:'ellipse',hiperbola:'hyperbola',circunferencia:'circle'};$('type').value=map[param]||'circle'}draw();
</script></body></html>
