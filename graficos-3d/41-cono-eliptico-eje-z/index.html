<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cono elíptico, eje z</title>

    <link rel="stylesheet" href="../../common/three-viewer.css">

    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)']],
          displayMath: [['\\[', '\\]']]
        },
        svg: {
          fontCache: 'global'
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  </head>

  <body>
    <main class="viewer-shell">
      <header class="viewer-head">
        <h1>Cono elíptico, eje z</h1>
        <p>
          <span class="equation">\(\frac{x^2}{4}+y^2=z^2\)</span>
          <span aria-hidden="true"> · </span>
          <span>Semiejes transversales 2 y 1.</span>
        </p>
      </header>

      <div id="stage"></div>

      <div class="adaptation">
        Arrastrá para rotar · rueda para zoom · botón derecho para desplazar.
      </div>

      <div class="controls">
        <button id="reset-camera">Restablecer cámara</button>
        <button id="export-png">Exportar PNG</button>
        <button id="toggle-grid">Malla</button>
        <button id="toggle-axes">Ejes</button>

        <label>
          Proyección
          <select id="projection">
            <option value="perspective">Perspectiva</option>
            <option value="ortho">Ortográfica</option>
          </select>
        </label>

        <label>
          Transparencia
          <input
            id="opacity"
            type="range"
            min="0.15"
            max="1"
            step="0.05"
            value="0.66"
          >
        </label>

        <label class="trace-controls">
          Traza \(z=\)<span id="trace-value"></span>
          <input id="trace-slider" type="range">
        </label>
      </div>
    </main>

    <script>
      window.GRAPH_CONFIG = {
  "title": "Cono elíptico, eje z",
  "equation": "x²/4+y²=z²",
  "description": "Semiejes transversales 2 y 1.",
  "type": "ellipticCone",
  "axis": "z",
  "a": 2,
  "b": 1,
  "c": 1,
  "T": 2,
  "camera": [
    7,
    5,
    8
  ],
  "axisSize": 5.5,
  "enableTrace": true,
  "traceMin": -2,
  "traceMax": 2,
  "traceInitial": 1,
  "traceRangeXY": [
    -5,
    5,
    -3,
    3
  ],
  "slug": "41-cono-eliptico-eje-z"
};
    </script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module" src="../../common/three-viewer.js"></script>
  </body>
</html>
