<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Paraboloide elíptico desplazado</title>

    <link rel="stylesheet" href="../../common/three-viewer.css">

    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)']],
          displayMath: [['\\[', '\\]']]
        },
        svg: {
          fontCache: 'global'
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  </head>

  <body>
    <main class="viewer-shell">
      <header class="viewer-head">
        <h1>Paraboloide elíptico desplazado</h1>
        <p>
          <span class="equation">\(\frac{(x-1)^2}{4}+\frac{(y+2)^2}{9}=z-3\)</span>
          <span aria-hidden="true"> · </span>
          <span>Vértice \((1,-2,3)\), eje paralelo a z.</span>
        </p>
      </header>

      <div id="stage"></div>

      <div class="adaptation">
        Arrastrá para rotar · rueda para zoom · botón derecho para desplazar.
      </div>

      <div class="controls">
        <button id="reset-camera">Restablecer cámara</button>
        <button id="export-png">Exportar PNG</button>
        <button id="toggle-grid">Malla</button>
        <button id="toggle-axes">Ejes</button>

        <label>
          Proyección
          <select id="projection">
            <option value="perspective">Perspectiva</option>
            <option value="ortho">Ortográfica</option>
          </select>
        </label>

        <label>
          Transparencia
          <input
            id="opacity"
            type="range"
            min="0.15"
            max="1"
            step="0.05"
            value="0.66"
          >
        </label>

        <label class="trace-controls">
          Traza \(z=\)<span id="trace-value"></span>
          <input id="trace-slider" type="range">
        </label>
      </div>
    </main>

    <script>
      window.GRAPH_CONFIG = {
  "title": "Paraboloide elíptico desplazado",
  "equation": "(x-1)²/4+(y+2)²/9=z-3",
  "description": "Vértice (1,-2,3), eje paralelo a z.",
  "type": "ellipticParaboloid",
  "a": 2,
  "b": 3,
  "R": 1.65,
  "center": [
    1,
    -2,
    3
  ],
  "camera": [
    12,
    10,
    14
  ],
  "target": [
    1,
    -2,
    5
  ],
  "axisSize": 8,
  "gridSize": 18,
  "enableTrace": true,
  "traceMin": 3,
  "traceMax": 6,
  "traceInitial": 4,
  "traceRangeXY": [
    -5,
    7,
    -8,
    4
  ],
  "slug": "28-paraboloide-eliptico-desplazado"
};
    </script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module" src="../../common/three-viewer.js"></script>
  </body>
</html>
